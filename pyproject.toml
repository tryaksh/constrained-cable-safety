[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-recovery-lab"
version = "0.1.0"
description = "Reproducible experiments for learning autonomous industrial assembly recovery."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
authors = [{ name = "Tryaksh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["assembly_recovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".deps", "artifacts", "outputs", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
