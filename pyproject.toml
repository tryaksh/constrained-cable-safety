[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-zero-g-blade-swap"
version = "0.1.0"
description = "Simulation-backed robotic serviceability qualification with Isaac Lab, rendered perception, and an observable compute service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
authors = [{ name = "Tryaksh" }]
keywords = ["robotics", "isaac-lab", "reinforcement-learning", "sim2real", "space-robotics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  # Match the HDF5 1.14.6 DLL bundled with Isaac Sim 5.1 on Windows.
  "h5py==3.13.0",
  "Jinja2>=3.1,<4",
  "numpy>=1.26,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  # Starlette 1.x moved TestClient to the async-native httpx2 package.
  "httpx2>=2.12,<3",
  "pytest>=8.0,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
zero-g-service = "zero_g_blade_swap.service.cli:main"

[project.urls]
Repository = "https://github.com/tryaksh/orbital-robotic-servicing-lab"
Issues = "https://github.com/tryaksh/orbital-robotic-servicing-lab/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zero_g_blade_swap.service" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "isaac: requires a local Isaac Sim and Isaac Lab installation",
  "camera: requires RTX rendering and --enable_cameras",
  "benchmark: hardware-dependent throughput/VRAM test",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".deps", "artifacts", "outputs", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Isaac Lab manager terms conventionally keep SceneEntityCfg objects in their
# signatures so the manager can inspect and resolve them during construction.
"src/zero_g_blade_swap/tasks/blade_swap/mdp/*.py" = ["B008"]
